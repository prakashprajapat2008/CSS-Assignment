<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .main {
            width: 100%;
            min-height: 100vh;
            border: 2px solid rgb(0, 0, 255);
        }

        .nav {
            width: 100%;
            min-height: 70px;
            border: 2px solid rgb(0, 0, 255);
            background-color: #121921;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav1 {
            width: 100%;
            height: 50px;
            border: 2px solid rgb(0, 0, 255);
            background-color: #243040;
            position: sticky;
            top: 70px;
            z-index: 9;
        }

        .logo {
            width: 150px;
            margin-top: 10px;
        }

        .logo img {
            width: 100%;
        }

        .p {
            margin-left: 50px;
        }

        .right h4 {
            color: white;
        }

        .right h5 {
            color: rgba(255, 255, 255, 0.748);
        }

        .nav2 {
            width: calc(100% - 30px);
            min-height: 100vh;
            margin: 0 auto;
            background-image: url(p.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            justify-content: center;
            align-content: start;
            gap: 20px;

            padding: 160px 20px 30px;
            position: relative;
        }

        .d1 {
            position: absolute;
            top: 120px;
            left: 30px;
        }

        .d2 {
            position: absolute;
            top: 120px;
            right: 30px;
        }

        .d1 img,
        .d2 img {
            display: block;
            max-width: 100%;
        }

        .d3 {
            width: 100%;
            max-width: 400px;
            min-height: 500px;
            border: 2px solid rgb(0, 0, 255);
            background-color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pp1 {
            width: 100%;
            min-height: 80px;
            font-size: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            margin-top: 10px;
        }

        .pp1 p1 {
            margin-left: 10px;
        }

        .pp2,
        .pp3 {
            width: 100%;
            min-height: 180px;
            display: flex;
        }

        .pp4 {
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            color: #64959F;
            margin-top: auto;
        }

        .pp4 h3 {
            margin-left: 10px;
        }

        .pp5,
        .pp6 {
            width: 50%;
            min-width: 0;
            min-height: 180px;
            display: flex;
            flex-wrap: wrap;
            padding: 5px;
        }

        .pp7 {
            width: 100%;
            height: 140px;
        }

        .pp7 img {
            width: 100%;
            height: 120px;
            object-fit: contain;
        }

        .pp8 {
            width: 100%;
            min-height: 40px;
            color: #989292;
            font-size: 14px;
        }

        .pp8 h3 {
            font-size: 16px;
        }

        .pp9 {
            width: 100%;
            min-height: 300px;
            padding: 10px;
        }

        .pp9 img {
            width: 100%;
            height: 300px;
            object-fit: contain;
        }

        .pp10 {
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            color: #64959F;
            margin-top: auto;
        }

        .pp10 h3 {
            margin-left: 11px;
        }

        .d4 {
            width: 100%;
            max-width: 300px;
            min-height: 500px;
            border: 2px solid rgb(0, 0, 255);
            background-color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }


        

    </style>

</head>

<body>

    <div class="main">

        <div class="nav">

            <div class="logo">
                <img src="logo.png" alt="Amazon Logo">
            </div>

            <div class="p">

                <div class="left"></div>

                <div class="right">
                    <h5>Hello</h5>
                    <h4>Select Your address</h4>
                </div>

            </div>

        </div>

        <div class="nav1"></div>

        <div class="nav2">

            <div class="d1">
                <img src="left arrow.png" alt="">
            </div>

            <div class="d2">
                <img src="right arrow.png" alt="">
            </div>

            <div class="d3">

                <div class="pp1">
                    <p1>Upgarde Your Home | Amazon Brands & More</p1>
                </div>

                <div class="pp2">

                    <div class="pp5">
                        <div class="pp7">
                            <img src="image 17.png" alt="Smart LED TV">
                        </div>
                        <div class="pp8">
                            <h3>Smart LED Tvs</h3>
                        </div>
                    </div>

                    <div class="pp6">
                        <div class="pp7">
                            <img src="image 18.png" alt="Appliances">
                        </div>
                        <div class="pp8">
                            <h3>Appliances</h3>
                        </div>
                    </div>

                </div>

                <div class="pp3">

                    <div class="pp5">
                        <div class="pp7">
                            <img src="image 20.png" alt="Furniture">
                        </div>
                        <div class="pp8">
                            <h3>Furniture</h3>
                        </div>
                    </div>

                    <div class="pp6">
                        <div class="pp7">
                            <img src="image 19.png" alt="Kitchen Products">
                        </div>
                        <div class="pp8">
                            <h3>Kitchen Products</h3>
                        </div>
                    </div>

                </div>

                <div class="pp4">
                    <h3>Shop New</h3>
                </div>

            </div>


            <div class="d3">

                <div class="pp1">
                    <p1>Upgarde Your Home | Amazon Brands & More</p1>
                </div>

                <div class="pp2">

                    <div class="pp5">
                        <div class="pp7">
                            <img src="image 25.png" alt="Smart LED TV">
                        </div>
                        <div class="pp8">
                            <h3>Smart LED Tvs</h3>
                        </div>
                    </div>

                    <div class="pp6">
                        <div class="pp7">
                            <img src="image 24.png" alt="Appliances">
                        </div>
                        <div class="pp8">
                            <h3>Appliances</h3>
                        </div>
                    </div>

                </div>

                <div class="pp3">

                    <div class="pp5">
                        <div class="pp7">
                            <img src="image 22.png" alt="Furniture">
                        </div>
                        <div class="pp8">
                            <h3>Furniture</h3>
                        </div>
                    </div>

                    <div class="pp6">
                        <div class="pp7">
                            <img src="image 21.png" alt="Kitchen Products">
                        </div>
                        <div class="pp8">
                            <h3>Kitchen Products</h3>
                        </div>
                    </div>

                </div>

                <div class="pp4">
                    <h3>Explore All</h3>
                </div>

            </div>


            <div class="d3">

                <div class="pp1">
                    <p1>Upgarde Your Home | Amazon Brands & More</p1>
                </div>

                <div class="pp2">
                    <div class="pp9">
                        <img src="image 26.png" alt="Home products">
                    </div>
                </div>

                <div class="pp10">
                    <h3>See More</h3>
                </div>

            </div>


            <div class="d4">

                <div class="pp1"></div>

                <div class="pp2">

                    <div class="pp5">
                        <div class="pp7"></div>
                        <div class="pp8"></div>
                    </div>

                    <div class="pp6">
                        <div class="pp7"></div>
                        <div class="pp8"></div>
                    </div>

                </div>

                <div class="pp3">

                    <div class="pp5">
                        <div class="pp7"></div>
                        <div class="pp8"></div>
                    </div>

                    <div class="pp6">
                        <div class="pp7"></div>
                        <div class="pp8"></div>
                    </div>

                </div>

                <div class="pp4"></div>

            </div>

        </div>

    </div>

</body>
</html>
