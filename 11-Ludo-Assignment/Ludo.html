<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game</title>

    <link rel="stylesheet" href="ludo.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
        }

        .main {
            width: 300px;
            height: 300px;
            position: relative;
        }

        .red,
        .green,
        .blue,
        .yellow {
            width: 120px;
            height: 120px;
            border: 15px solid;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex-shrink: 0;
        }

        .red {
            border-color: red;
        }

        .green {
            border-color: green;
        }

        .blue {
            border-color: blue;
        }

        .yellow {
            border-color: yellow;
        }

        .r,
        .g,
        .b,
        .y {
            height: 17px;
            width: 17px;
            border: 2px solid;
            border-radius: 50%;
        }

        .r {
            border-color: red;
        }

        .g {
            border-color: green;
        }

        .b {
            border-color: blue;
        }

        .y {
            border-color: yellow;
        }

        .r2,
        .r3,
        .g2,
        .g3,
        .b2,
        .b3,
        .y2,
        .y3 {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .red br,
        .green br,
        .blue br,
        .yellow br {
            display: none;
        }

        .upper,
        .lower {
            display: flex;
            width: 300px;
            height: 120px;
        }

        .rg,
        .rxg {
            width: 60px;
            height: 120px;
            flex-shrink: 0;
        }

        .middle {
            display: flex;
            justify-content: space-between;
            width: 300px;
            height: 60px;
        }

        .rb,
        .ryb {
            width: 120px;
            height: 60px;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%;
            height: 100%;
        }

        table tr td {
            border: 1px solid black;
            width: 20px;
            height: 20px;
            text-align: center;
            padding: 0;
            font-size: 13px;
        }

        .rgg {
            background: green;
        }

        .rbga {
            background: red;
        }

        .rygg {
            background: green;
        }

        .rybga {
            background: yellow;
        }

        .rxgg {
            background: blue;
        }

        .rxbga {
            background: red;
        }

        .abcd {
            position: absolute;
            width: 60px;
            height: 60px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .ja,
        .jab,
        .jac,
        .jad {
            position: absolute;
            width: 60px;
            height: 60px;
            top: 0;
            left: 0;
        }

        .ja {
            background: green;
            clip-path: polygon(0 0, 100% 0, 50% 50%);
        }

        .jab {
            background: red;
            clip-path: polygon(0 0, 50% 50%, 0 100%);
        }

        .jac {
            background: blue;
            clip-path: polygon(0 100%, 50% 50%, 100% 100%);
        }

        .jad {
            background: yellow;
            clip-path: polygon(100% 0, 50% 50%, 100% 100%);
        }

       
        
    </style>

</head>
<body>

    <div class="main">
        <div class="upper">
            <div class="red">
                <div class="r2">
                    <div class="r"></div>
                    <div class="r"></div>
                </div><br><br>
                <div class="r3">
                    <div class="r"></div>
                    <div class="r"></div>
                </div>
            </div>

            <div class="rg">
                <table>
                    <tr class="a">
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr class="a">
                        <td></td>
                        <td class="rgg"></td>
                        <td class="rgg">★</td>
                    </tr>
                    <tr class="a">
                        <td class="rgg">★</td>
                        <td class="rgg"></td>
                        <td></td>
                    </tr>
                    <tr class="a">
                        <td></td>
                        <td class="rgg"></td>
                        <td></td>
                    </tr>
                    <tr class="a">
                        <td></td>
                        <td class="rgg"></td>
                        <td></td>
                    </tr>
                    <tr class="a">
                        <td></td>
                        <td class="rgg"></td>
                        <td></td>
                    </tr>
                </table>
            </div>

            <div class="green">
                <div class="g2">
                    <div class="g"></div>
                    <div class="g"></div>
                </div><br><br>
                <div class="g3">
                    <div class="g"></div>
                    <div class="g"></div>
                </div>
            </div>
        </div>

        <div class="middle">
            <div class="rb">
                <table class="tb">
                    <tr class="rbb">
                        <td></td>
                        <td class="rbga">★</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr class="rbb">
                        <td></td>
                        <td class="rbga"></td>
                        <td class="rbga"></td>
                        <td class="rbga"></td>
                        <td class="rbga"></td>
                        <td class="rbga"></td>
                    </tr>
                    <tr class="rbb">
                        <td></td>
                        <td></td>
                        <td class="rbga">★</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </table>
            </div>

            <div class="ryb">
                <table class="tyb">
                    <tr class="rybb">
                        <td></td>
                        <td></td>
                        <td></td>
                        <td class="rybga">★</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr class="rybb">
                        <td class="rybga"></td>
                        <td class="rybga"></td>
                        <td class="rybga"></td>
                        <td class="rybga"></td>
                        <td class="rybga"></td>
                        <td></td>
                    </tr>
                    <tr class="rybb">
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td class="rybga">★</td>
                        <td></td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="lower">
            <div class="blue">
                <div class="b2">
                    <div class="b"></div>
                    <div class="b"></div>
                </div><br><br>
                <div class="b3">
                    <div class="b"></div>
                    <div class="b"></div>
                </div>
            </div>

            <div class="rxg">
                <table>
                    <tr class="ax">
                        <td></td>
                        <td class="rxgg"></td>
                        <td></td>
                    </tr>
                    <tr class="ax">
                        <td></td>
                        <td class="rxgg"></td>
                        <td></td>
                    </tr>
                    <tr class="ax">
                        <td></td>
                        <td class="rxgg"></td>
                        <td></td>
                    </tr>
                    <tr class="ax">
                        <td></td>
                        <td class="rxgg"></td>
                        <td class="rxgg">★</td>
                    </tr>
                    <tr class="ax">
                        <td class="rxgg">★</td>
                        <td class="rxgg"></td>
                        <td></td>
                    </tr>
                    <tr class="ax">
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </table>
            </div>

            <div class="yellow">
                <div class="y2">
                    <div class="y"></div>
                    <div class="y"></div>
                </div><br><br>
                <div class="y3">
                    <div class="y"></div>
                    <div class="y"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="abcd">
        <div class="ja"></div>
        <div class="jab"></div>
        <div class="jac"></div>
        <div class="jad"></div>
    </div>



</body>
</html>
