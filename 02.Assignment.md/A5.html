<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: burlywood;
            color: white;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .main {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px;
        }

        .sidebar {
            flex: 0 0 250px;
            padding: 15px;
            background: #eee;
        }

        .content {
            flex: 1;
            padding: 15px;
            background: #f5f5f5;
        }

        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: burlywood;
            color: white;
        }
    </style>

</head>

<body>


    <div class="app">
        <header class="header">
            <h2>MyApp</h2>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <main class="main">
            <aside class="sidebar">
                <h3>Categories</h3>
                <p>Web Development</p>
                <p>Design</p>
                <p>Programming</p>
            </aside>

            <section class="content">
                <h1>Welcome to MyApp</h1>
                <p>Learn and build amazing projects.</p>
            </section>
        </main>

        <footer class="footer">© 2026 MyApp</footer>
    </div>


</body>

</html>
