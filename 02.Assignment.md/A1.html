<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Design</title>

    <style>
     
      
        body {
            display: flex;
            width: 1000px;
            height: 650px;
            /* border: 2px solid black; */
            margin-left: 150px;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 1500px;
            height: 100px;
            padding: 0 35px;
            /* border: 2px solid black; */
            background-color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 30px;
            font-weight: bold;
            color: #111;
        }

        .logo-circle {
            width: 32px;
            height: 32px;
            background-color: #4526e8;
            border-radius: 50%;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 40px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            font-size: 18px;
            color: #444;
            cursor: pointer;
        }

        .nav-links .active {
            color: #2c09a1;
        }

        .dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .arrow {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 7px solid #333;
        }

        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .login {
            font-size: 18px;
            color: #444;
            cursor: pointer;
        }

        .btn {
            padding: 10px 18px;
            font-size: 18px;
            color: white;
            background-color: #4526e8;
            border: 1px solid #222;
            border-radius: 5px;
            cursor: pointer;
        }


    </style>
    
</head>
<body>

    <header class="navbar">

        <div class="logo">
            <span class="logo-circle"></span>
            <span>Logo</span>
        </div>

        <ul class="nav-links">
            <li>About</li>

            <li class="dropdown">
                Solutions
                <span class="arrow"></span>
            </li>

            <li class="active">Resources</li>
            <li>Pricing</li>
            <li>Contact</li>
        </ul>

        <div class="auth-buttons">
            <span class="login">Login</span>
            <button class="btn">Button</button>
        </div>

    </header>

</body>
</html>
