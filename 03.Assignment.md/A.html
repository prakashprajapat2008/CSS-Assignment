<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">

    <style>

        .main{
    width: 250px;
    height: 400px;
    box-shadow: 0px 0px 5px black;
    display: flex;
    flex-direction: column;
    padding: 10px  10px  10px  10px;
    gap: 10px;
    background-color: #1C1C1C;
    margin-left: 300px;
    margin-top: 180px;
    

}

.div1{
    /* border: 1px solid red; */
    height: 70px;
    color: white;
    font-weight: bolder;
    padding-right: 20px;
    display: flex;
    flex-direction: row;
    justify-content: right;
    font-size: 50px;
    align-items: center;


}
.div2 , .div3 , .div4 , .div5 , .div6 {
    display: flex;
    flex-direction: row;
    /* border: 1px solid red; */
    height: 60px;
    gap: 12px;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: large;
    font-weight: bold;
}

.div21 , .div22 , .div23 {
    height: 50px;
    width: 50px;
    background-color: #A2A2A2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.div31 , .div32 , .div33 , .div41 , .div42 , .div43 , .div51 , .div52 , .div53 , .div62 {
       height: 50px;
    width: 50px;
    background-color: #505050;
    border-radius: 50%;
      display: flex;
    align-items: center;
    justify-content: center;

}

.div24 , .div34 , .div44 , .div54 , .div63{
        height: 50px;
    width: 50px;
    background-color: #FF9500;
    border-radius: 50%;
      display: flex;
    align-items: center;
    justify-content: center;
}

.div61{
         height: 50px;
    width: 91px;
    background-color: #505050;
    border-radius: 30px;
      display: flex;
    align-items: center;
    justify-content: left;
    padding-left: 25px;

}

    </style>
</head>
<body >
    <div class="container">
    <div class="main">
    <div class="div1">
       <p>7744</p>
    </div>
    <div class="div2">
        <div class="div21">C</div>
        <div class="div22">+/-</div>
        <div class="div23">%</div>
        <div class="div24">/</div>
    </div>
    <div class="div3">
        <div class="div31">7</div>
        <div class="div32">8</div>
        <div class="div33">9</div>
        <div class="div34">X</div>
    </div>
    <div class="div4">
        <div class="div41">4</div>
        <div class="div42">5</div>
        <div class="div43">6</div>
        <div class="div44">-</div>
    </div>
    <div class="div5">
        <div class="div51">1</div>
        <div class="div52">2</div>
        <div class="div53">3</div>
        <div class="div54">+</div>
    </div>
    <div class="div6">
        <div class="div61">0</div>
        <div class="div62">.</div>
        <div class="div63">=</div>
    </div>
    </div>
    </div>
    
</body>
</html>
